# ==============================================================================
# Szablon konfiguracji zadania log-transfer-v2
# Środowisko docelowe: RHEL 7 (tylko standardowe pakiety Red Hat)
# ==============================================================================

# Identyfikator zadania (unikalny, [a-zA-Z0-9_-])
JOB_ID="example_job"
JOB_DESCRIPTION="Przykładowe zadanie transferu logów"
OWNER_USER="root"

# Katalog bazowy instalacji (domyślnie /opt/log-transfer)
BASE_DIR="/opt/log-transfer"

# ------------------------------------------------------------------------------
# ŹRÓDŁO LOGÓW
# ------------------------------------------------------------------------------
# Tryb pracy:
#   "search" - wyszukuje pliki zmodyfikowane w ciągu ostatnich SEARCH_MTIME_DAYS dni
#   "mirror" - synchronizuje cały katalog LOCAL_MIRROR_DIR
TRANSFER_MODE="search"

# Katalog źródłowy dla trybu "search"
SEARCH_DIR="/var/log/app"
# Parametr -mtime dla find (np. "-1" = ostatnie 24h, "-14" = ostatnie 14 dni)
SEARCH_MTIME_DAYS="-1"
# Wykluczenia ścieżek (rozdzielone spacją, wzorce dla find -not -path)
SEARCH_EXCLUDE_PATHS="*/.snapshot/*"
# Pomijaj pliki modyfikowane w ostatniej minucie (ochrona przed czytaniem otwartych logów)
SKIP_ACTIVE_WRITES="true"

# Katalog źródłowy dla trybu "mirror"
LOCAL_MIRROR_DIR=""

# Zdalne hosty do pobrania logów po SSH przed wysyłką (opcjonalne)
# Format: "user@host:/zdalny/katalog" lub "host:/zdalny/katalog"
HOSTS_LOGS_LIST=()
REMOTE_SSH_MTIME_DAYS="+1"
REMOTE_SSH_KEY=""

# ------------------------------------------------------------------------------
# MONTOWANIE FILESYSTEMU (opcjonalne, odpowiednik logs_mount.sh)
# ------------------------------------------------------------------------------
MOUNT_FILESYSTEM="false"
MOUNT_SOURCE=""
MOUNT_TYPE="ext4"
MOUNT_OPTIONS="ro,noexec,nosuid"
MOUNT_TARGET=""

# ------------------------------------------------------------------------------
# PAKOWANIE I KOMPRESJA
# ------------------------------------------------------------------------------
# Czy pakować zebrane pliki w jedno archiwum .tar.gz (jak logs_copy2.sh)?
#   "true"  - tworzy jedno archiwum tar.gz (szybsze FTP, mniej komend STOR)
#   "false" - kompresuje pojedyncze pliki (gzip -6 równolegle) i wysyła strukturę
PACK_ARCHIVE="true"
ARCHIVE_PREFIX="logs"
GZIP_LEVEL="6"
COMPRESS_PARALLEL="4"

# Opcjonalne szyfrowanie GPG przed wysyłką po zwykłym FTP (wymaga gnupg2 z repo RHEL)
GPG_ENCRYPT="false"
GPG_RECIPIENT=""

# ------------------------------------------------------------------------------
# TRANSPORT (FTP / FTPS / SFTP)
# ------------------------------------------------------------------------------
# Możliwe wartości: "ftp" (zwykły FTP), "ftps" (FTP over TLS), "sftp"
TRANSFER_PROTOCOL="ftp"
FTP_HOST="ftp.example.com"
FTP_PORT="21"
FTP_USER="loguser"
# Ścieżka do pliku z hasłem lub .netrc (chmod 0600, nigdy wprost w tym pliku!)
# Plik CREDENTIALS_FILE powinien zawierać jedną linię z hasłem lub format netrc.
CREDENTIALS_FILE="/opt/log-transfer/etc/creds/example_job.pass"
REMOTE_DIR="/remote/logs"
FTP_PARALLEL="4"
FTP_PASSIVE="true"
FTP_TIMEOUT_SEC="30"
FTP_MAX_RETRIES="3"

# Ustawienia TLS (używane tylko gdy TRANSFER_PROTOCOL="ftps")
FTPS_VERIFY_CERT="true"
FTPS_CA_FILE="/etc/pki/tls/certs/ca-bundle.crt"

# Ustawienia SFTP (używane tylko gdy TRANSFER_PROTOCOL="sftp")
SFTP_HOST=""
SFTP_PORT="22"
SFTP_KEY_FILE=""
SFTP_KNOWN_HOSTS="/opt/log-transfer/etc/known_hosts"
