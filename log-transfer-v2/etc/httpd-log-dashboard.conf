# Konfiguracja Apache httpd (RHEL 7) dla Log Transfer Dashboard & Zabbix JSON API
# Skopiuj do: /etc/httpd/conf.d/log-dashboard.conf

<VirtualHost *:443>
    ServerName log-transfer.local

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/localhost.crt
    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key

    DocumentRoot /var/www/log-dashboard

    <Directory "/var/www/log-dashboard">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        # Ogranicz dostęp do podsieci administracyjnej i localhosta
        Require ip 127.0.0.1 10.0.0.0/8 192.168.0.0/16
    </Directory>

    # Udostępnianie atomowych plików JSON dla Dashboardu i Zabbix 7 HTTP Agent
    Alias /api /opt/log-transfer/var/state
    <Directory "/opt/log-transfer/var/state">
        Options -Indexes
        AllowOverride None
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
        # Dostęp z sieci adminów oraz serwera/proxy Zabbix
        Require ip 127.0.0.1 10.0.0.0/8 192.168.0.0/16
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>
